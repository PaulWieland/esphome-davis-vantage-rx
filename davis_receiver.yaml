substitutions:
  wu_station_id: !secret wu_station_id
  wu_password: !secret wu_password
  name: davis-vantage-receiver
  friendly_name: Vantage Receiver

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: custom_components


# --- OPTIONAL: MQTT BROADCAST ---
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password

# --- OPTIONAL: WEATHER UNDERGROUND ---
http_request:
  useragent: "ESPHome Davis Receiver"
  timeout: 10s

# Enable logging to see the data in the console
logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Davis-Receiver-Fallback"
    password: "fallback_password"

captive_portal:

# Enable Web server
web_server:
  port: 80

# OTA updates
ota:
  - platform: esphome

# SPI Bus configuration for communicating with CC1101
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

# CC1101 Component Setup
# NOTE: VCC -> 3.3V (DO NOT USE 5V)
# GND -> GND
# CSN -> GPIO5
# GDO0 -> GPIO4

cc1101:
  id: my_cc1101
  cs_pin: GPIO5
  gdo0_pin: GPIO4
  frequency: 915.0MHz
  modulation_type: GFSK
  symbol_rate: 19200
  fsk_deviation: 9.5kHz
  filter_bandwidth: 812kHz
  magn_target: 33dB
  packet_mode: true
  packet_length: 8
  sync_mode: 16/16
  sync1: 0xCB
  sync0: 0x89
  crc_enable: false
  whitening: false
  num_preamble: 2
  on_packet:
    then:
      - lambda: "id(my_davis).process_packet(x);"

# Clean Davis Vantage Custom Component
davis_vantage:
  id: my_davis
  cc1101_id: my_cc1101
  unit_id: 0

sensor:
  - platform: davis_vantage
    davis_vantage_id: my_davis
    temperature:
      name: "Temperature"
      id: davis_temp
    humidity:
      name: "Humidity"
      id: davis_hum
    wind_speed:
      name: "Wind Speed"
      id: davis_wind_speed
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
    wind_gust:
      name: "Wind Gust"
      id: davis_windgust
    daily_rain:
      name: "Daily Rain"
      id: davis_rain
    rain_rate:
      name: "Rain Rate"
      id: davis_rain_rate

binary_sensor:
  - platform: davis_vantage
    davis_vantage_id: my_davis
    battery_low:
      name: "Battery Low"
      id: davis_battery_low

text_sensor:
  - platform: davis_vantage
    davis_vantage_id: my_davis
    wind_direction:
      name: "Wind Direction"
      id: davis_wind_dir_combined


interval:
  # --- OPTIONAL: MQTT PUBLISH INTERVAL ---
  - interval: 30s
    then:
      - if:
          condition:
            - lambda: "return id(davis_temp).has_state();"
          then:
            - mqtt.publish_json:
                topic: "weather/loop"
                payload: |-
                  root["outTemp_F"] = id(my_davis).get_temp_f();
                  root["outHumidity"] = id(my_davis).get_humidity();
                  root["dewpoint_F"] = id(my_davis).get_dew_point_f();
                  root["windSpeed_mph"] = id(my_davis).get_wind_mph();
                  root["windSpeed10_mph"] = id(my_davis).get_wind_mph();
                  root["windDir"] = id(my_davis).get_wind_dir_degrees();
                  root["windGust_mph"] = id(my_davis).get_gust_mph();
                  root["dayRain_in"] = id(my_davis).get_daily_rain_in();
                  root["rainRate_in_per_hr"] = id(my_davis).get_rain_rate_in();

  # --- OPTIONAL: WUNDERGROUND PUBLISH INTERVAL ---
  - interval: 60s
    then:
      - if:
          condition:
            - lambda: "return id(davis_temp).has_state();"
          then:
            - http_request.get:
                url: !lambda |-
                  char url[300];
                  float temp = id(my_davis).get_temp_f();
                  float hum = id(my_davis).get_humidity();
                  float dew = id(my_davis).get_dew_point_f();
                  float wind = id(my_davis).get_wind_mph();
                  float dir = id(my_davis).get_wind_dir_degrees();
                  float gust = id(my_davis).get_gust_mph();
                  float rain = id(my_davis).get_daily_rain_in();
                  float rain_rate = id(my_davis).get_rain_rate_in();
                  
                  sprintf(url, "https://rtupdate.wunderground.com/weatherstation/updateweatherstation.php?ID=%s&PASSWORD=%s&dateutc=now&tempf=%.1f&dewptf=%.1f&humidity=%.0f&windspeedmph=%.1f&winddir=%.0f&windgustmph=%.1f&dailyrainin=%.2f&rainin=%.2f&action=updateraw",
                          "${wu_station_id}", "${wu_password}",
                          temp, dew, hum, wind, dir, gust, rain, rain_rate);
                  return std::string(url);
